<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7fb">
    <title>구독 한눈에 보기</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/logic.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <div class="page-shell">
        <header class="page-header">
            <a class="brand" href="#" aria-label="구독 한눈에 보기 홈">
                <span class="brand-mark" aria-hidden="true">₩</span>
                <span>구독 한눈에 보기</span>
            </a>
            <p class="header-note">매달 빠져나가는 구독료를 한곳에서 관리해요.</p>
        </header>

        <main>
            <section class="summary-grid" aria-label="구독 요약">
                <article class="summary-card summary-card-primary">
                    <p class="summary-label">월 구독료</p>
                    <p class="summary-value" id="monthly-total">₩0</p>
                    <p class="summary-caption">매달 기준으로 환산한 금액</p>
                </article>
                <article class="summary-card">
                    <p class="summary-label">연간 예상 금액</p>
                    <p class="summary-value" id="yearly-total">₩0</p>
                    <p class="summary-caption">월 구독료 × 12개월</p>
                </article>
                <article class="summary-card">
                    <p class="summary-label">이번 주 결제 예정</p>
                    <p class="summary-value" id="upcoming-total">₩0</p>
                    <p class="summary-caption" id="upcoming-count">예정된 구독이 없어요</p>
                </article>
            </section>

            <div class="content-grid">
                <section class="panel subscriptions-panel" aria-labelledby="subscriptions-title">
                    <div class="section-heading">
                        <div>
                            <p class="eyebrow">MY SUBSCRIPTIONS</p>
                            <h1 id="subscriptions-title">내 구독</h1>
                        </div>
                        <span class="item-count" id="subscription-count">0개</span>
                    </div>
                    <div class="subscription-list" id="subscription-list" aria-live="polite"></div>
                </section>

                <aside class="side-column">
                    <section class="panel category-panel" aria-labelledby="category-title">
                        <div class="section-heading compact-heading">
                            <div>
                                <p class="eyebrow">MONTHLY BREAKDOWN</p>
                                <h2 id="category-title">카테고리별 비중</h2>
                            </div>
                        </div>
                        <div id="category-list" class="category-list"></div>
                    </section>

                    <section class="panel form-panel" aria-labelledby="form-title">
                        <div class="section-heading compact-heading">
                            <div>
                                <p class="eyebrow">KEEP IT UPDATED</p>
                                <h2 id="form-title">구독 추가</h2>
                            </div>
                        </div>
                        <p class="form-description" id="form-description">새로운 구독 정보를 입력해 주세요.</p>
                        <div class="notice" id="form-message" role="status" aria-live="polite" hidden></div>
                        <form id="subscription-form">
                            <label class="field">
                                <span>구독 이름</span>
                                <input name="name" type="text" maxlength="50" placeholder="예: 음악 스트리밍" required>
                            </label>
                            <div class="field-row">
                                <label class="field">
                                    <span>금액 (원)</span>
                                    <input name="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="10900" required>
                                </label>
                                <label class="field">
                                    <span>결제 주기</span>
                                    <select name="cycle" required>
                                        <option value="monthly">매월</option>
                                        <option value="yearly">매년</option>
                                    </select>
                                </label>
                            </div>
                            <label class="field">
                                <span>다음 결제일</span>
                                <input name="nextPaymentDate" type="date" required>
                            </label>
                            <div class="field-row">
                                <label class="field">
                                    <span>카테고리</span>
                                    <input name="category" type="text" maxlength="30" placeholder="예: 음악" required>
                                </label>
                                <label class="field">
                                    <span>결제 수단</span>
                                    <select name="paymentMethod" required>
                                        <option value="카드">카드</option>
                                        <option value="계좌이체">계좌이체</option>
                                        <option value="휴대폰결제">휴대폰결제</option>
                                    </select>
                                </label>
                            </div>
                            <div class="form-actions">
                                <button class="button button-secondary" id="cancel-edit" type="button" hidden>취소</button>
                                <button class="button button-primary" id="submit-button" type="submit">구독 추가하기</button>
                            </div>
                        </form>
                    </section>
                </aside>
            </div>
        </main>

        <footer class="page-footer">내 구독 정보는 이 브라우저에만 안전하게 저장돼요.</footer>
    </div>
</body>
</html>
